<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cross-Tab-Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Cross-Tab-Sync</h1>
      <span id="badge" class="badge" hidden></span>
    </header>

    <form id="pair-view" novalidate hidden>
      <label>Paste pairing link
        <input id="pair-link" type="text" placeholder="https://tabs.example.com#ABCD2345" autocomplete="off"
          spellcheck="false" autocapitalize="off" />
      </label>
      <p id="pair-target" class="hint">From <b>Invite another browser</b> on a paired browser, or <code>cross-tab-sync pair-code</code> on the server.</p>
      <label>Device name
        <input id="device-name" type="text" maxlength="64" />
      </label>
      <details id="pair-advanced">
        <summary>Advanced</summary>
        <label>Server URL
          <input id="server-url" type="text" inputmode="url" placeholder="https://tabs.example.com" autocomplete="url"
            spellcheck="false" autocapitalize="off" />
        </label>
        <label>Pairing code
          <input id="pair-code" type="text" maxlength="16" autocomplete="one-time-code"
            spellcheck="false" autocapitalize="characters" placeholder="8 characters" />
        </label>
      </details>
      <button id="pair" type="submit" class="primary">Pair</button>
    </form>

    <section id="main-view" hidden>
      <dl class="facts">
        <dt>Role</dt><dd id="role"></dd>
        <dt>Owner</dt><dd id="owner"></dd>
        <dt>Last sync</dt><dd id="last-sync"></dd>
        <dt>Local changes</dt><dd id="sync-state"></dd>
      </dl>
      <p id="applied-note" class="hint"></p>
      <p id="status-text" class="status"></p>
      <p id="last-activity" class="hint" hidden></p>
      <div class="actions">
        <button id="hand-over" type="button">Hand over</button>
        <button id="continue-here" type="button">Continue here</button>
        <button id="sync-now" type="button" title="Owner: publish pending changes. Follower: send local changes and fetch the latest.">Sync now</button>
        <button id="pause" type="button" title="Stop syncing on this browser. Local changes are kept.">Pause sync</button>
        <button id="grant" type="button" class="wide primary" hidden>Grant access to the server</button>
      </div>
      <details id="recover-section">
        <summary>Recover</summary>
        <p id="restore-note" class="hint"></p>
        <ul id="snapshots" class="list"></ul>
      </details>
      <details id="device-section">
        <summary>This device <span id="self-summary" class="muted"></span></summary>
        <dl class="facts">
          <dt>Name</dt>
          <dd><span id="self-name"></span> <button id="rename" type="button" class="link">Rename</button></dd>
          <dt>Browser</dt><dd id="self-browser"></dd>
          <dt>Device id</dt>
          <dd><code id="self-id"></code> <button id="copy-id" type="button" class="link" title="Copy the full device id">Copy</button></dd>
          <dt>Server</dt><dd id="self-server"></dd>
          <dt>Paired since</dt><dd id="self-since"></dd>
        </dl>
        <form id="rename-form" class="inline" hidden>
          <input id="rename-input" type="text" maxlength="64" aria-label="New device name" />
          <button type="submit">Save</button>
          <button id="rename-cancel" type="button" class="link">Cancel</button>
        </form>
      </details>
      <details id="devices-section">
        <summary>Devices</summary>
        <ul id="devices" class="list"></ul>
      </details>
      <div class="pairing">
        <button id="invite" type="button" class="link">Invite another browser</button>
        <div id="invite-box" hidden>
          <div class="inline">
            <input id="invite-link" type="text" readonly aria-label="Pairing link" />
            <button id="copy-link" type="button">Copy</button>
          </div>
          <p id="invite-note" class="hint"></p>
        </div>
      </div>
      <footer>
        <button id="disconnect" type="button" class="link danger">Disconnect</button>
      </footer>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
